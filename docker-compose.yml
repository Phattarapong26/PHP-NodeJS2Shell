services:
  php-scanner:
    build: .
    image: thaicert-php-scanner:latest
    container_name: thaicert-php-scanner
    restart: unless-stopped
    ports:
      - "5050:5050"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - HOST_IP=${HOST_IP:-}
      - HOST_SUBNET=${HOST_SUBNET:-}
      - HOST_NETMASK=${HOST_NETMASK:-}
      - HOST_CIDR=${HOST_CIDR:-}
      - HOST_GATEWAY=${HOST_GATEWAY:-}
      - HOST_INTERFACE=${HOST_INTERFACE:-}
      - IS_DOCKER=true
      - DOCKER_CONTAINER=true
    volumes:
      - ./host_network.json:/app/host_network.json:ro
      - ./active_hosts.txt:/app/active_hosts.txt:ro
      - ./thaicert-scanner/dist:/app/thaicert-scanner/dist
      - ./app.py:/app/app.py
      - ./profiles.db:/app/profiles.db
      - ./fonts:/app/fonts:ro
      - ./core:/app/core
      - ./api:/app/api
      - ./audit:/app/audit
      - ./reports:/app/reports
